name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-scf:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/package-api-scf.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: weevibe_ci_only
          POSTGRES_DB: weevibe_acceptance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weevibe_acceptance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Disposable service-container fixture only; never a real account credential.
      DATABASE_URL: postgresql://postgres:weevibe_ci_only@127.0.0.1:5432/weevibe_acceptance_ci?schema=public
      WEEVIBE_CHECK_API_BASE_URL: http://127.0.0.1:43188
      WECHAT_APP_SECRET: ''
      AMAP_WEB_SERVICE_KEY: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.15.1
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix cloudfunctions/weevibeLogin --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix cloudfunctions/weevibeNotifyGathering --ignore-scripts --no-audit --no-fund
      - run: pnpm db:generate && pnpm db:validate
      - run: pnpm typecheck && pnpm test
      - run: pnpm build:api && pnpm build:mini
      - run: pnpm db:migrate
      - name: Check WG04 formation exit and replacement in disposable PostgreSQL
        run: pnpm exec tsx scripts/check-wg04-postgres.ts --fixture-only
      - name: Check WG05 editing and reacceptance in disposable PostgreSQL
        run: pnpm exec tsx scripts/check-wg05-postgres.ts --fixture-only
      - name: Check WG06 handover lifecycle and races in disposable PostgreSQL
        run: pnpm exec tsx scripts/check-wg06-postgres.ts --fixture-only
      - name: Check v38 preparations and privacy in disposable PostgreSQL
        run: pnpm exec tsx scripts/check-v38-preparation.ts --fixture-only
      - name: Check HTML gathering flows and privacy in disposable PostgreSQL
        run: |
          pnpm exec tsx scripts/check-gathering-integration.ts --fixture-only
          pnpm exec tsx scripts/check-gathering-http.ts --fixture-only
          pnpm exec tsx scripts/check-gathering-notifications.ts --fixture-only
          pnpm exec tsx scripts/check-gathering-presentation.ts --fixture-only
          pnpm exec tsx scripts/check-inspiration-intake.ts --fixture-only
      - run: node scripts/prepare-cloud-identity-fixture.mjs --fixture-only
      - name: Start standalone and test real PG transactions
        shell: bash
        run: |
          mkdir -p .working
          HOSTNAME=127.0.0.1 PORT=43188 node --env-file=.working/cloud-identity-api.fixture.env apps/web/.next/standalone/apps/web/server.js > .working/ci-api.log 2>&1 &
          echo $! > .working/ci-api.pid
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:43188/api/v1/ready
          pnpm check:business-boundaries
          pnpm check:postgres:prepare
          node --env-file=.working/cloud-identity-test.fixture.env --import tsx scripts/check-cloud-identity-integration.ts
      - name: Restart PG and standalone, then verify persistence
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          previous_api=$(cat .working/ci-api.pid)
          kill -TERM "$previous_api"
          for attempt in {1..30}; do
            if ! kill -0 "$previous_api" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$previous_api" 2>/dev/null; then echo 'Previous API did not exit'; exit 1; fi
          docker restart "$POSTGRES_CONTAINER"
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d weevibe_acceptance_ci; then break; fi
            sleep 1
          done
          docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d weevibe_acceptance_ci
          HOSTNAME=127.0.0.1 PORT=43188 node --env-file=.working/cloud-identity-api.fixture.env apps/web/.next/standalone/apps/web/server.js > .working/ci-api-restart.log 2>&1 &
          echo $! > .working/ci-api.pid
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:43188/api/v1/ready
          pnpm check:postgres:verify
      - name: Diagnose failed standalone
        if: failure()
        shell: bash
        run: |
          curl --silent --max-time 5 http://127.0.0.1:43188/api/v1/ready || true
          for log in .working/ci-api.log .working/ci-api-restart.log; do
            if [ -f "$log" ]; then tail -n 40 "$log"; fi
          done
      - name: Stop local test API
        if: always()
        shell: bash
        run: |
          if [ -f .working/ci-api.pid ]; then kill -TERM "$(cat .working/ci-api.pid)" 2>/dev/null || true; fi

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build Linux standalone image
        run: docker build -f apps/web/Dockerfile -t weevibe-api:ci .
      - name: Check image with no secrets configured
        shell: bash
        run: |
          docker run -d --name weevibe-api-ci -p 127.0.0.1:43189:3000 weevibe-api:ci
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:43189/api/v1/health
          status=$(curl --silent --output /tmp/weevibe-ready.json --write-out '%{http_code}' http://127.0.0.1:43189/api/v1/ready)
          test "$status" = '503'
      - name: Diagnose failed container startup
        if: failure()
        run: docker logs weevibe-api-ci 2>/dev/null || true
      - name: Stop test container
        if: always()
        run: docker stop weevibe-api-ci 2>/dev/null || true
